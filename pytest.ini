[pytest]
# Without this, pytest's default "prepend" import mode only puts the
# directory containing the collected test files on sys.path. This repo's
# tests/ has no __init__.py, so that directory is just tests/ itself --
# `from app.main import app` then fails with ModuleNotFoundError, which is
# exactly the failure the GitHub Actions run surfaced (see README).
pythonpath = .
